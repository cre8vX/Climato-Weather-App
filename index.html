<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climato Weather</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Video for Welcome Screen -->
    <video autoplay muted loop playsinline id="bgVideo">
        <source src="vid/5680241-hd_1920_1080_30fps.mp4" type="video/mp4">
    </video>
    <!-- Video එක අඳුරු කර Search Box එක පැහැදිලිව පෙන්වීමට Overlay එකක් -->
    <div id="videoOverlay" class="video-overlay"></div>

    <div class="app-container">
        
        
        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="txtSearchId" placeholder="Search city (e.g. Galle, London)">
            <button onclick="btnSearchOnAction()">🔍</button>
            <button onclick="getUserLocation()" title="My Location">📍</button>
        </div>

        
        <div id="weatherContent" class="weather-card" style="display: none;">
            <!-- Current Weather -->
            <div class="current-info">
                <p id="dateTime" class="date-time"></p>
                <div class="main-temp-row">
                    <img id="mainIcon" src="" alt="icon">
                    <div class="temp-details">
                        <h1 id="mainCondition"></h1>
                        <h2 id="mainTemp"></h2>
                    </div>
                </div>
                <p id="locationName" class="location"></p>
            </div>

            <!-- Sun Times -->
            <div class="sun-times">
                <span>🌅 <span id="sunrise"></span></span>
                <span>---</span>
                <span>🌇 <span id="sunset"></span></span>
            </div>

            <!-- Rain & Stats -->
            <div class="stats-row">
                <div class="rain-chance">
                    <span>🌧️ Rain: <span id="rainChance"></span>%</span>
                </div>
            </div>
            <div class="humidity-wind">
                <span>Humidity: <span id="humidity"></span>%</span>
                <span>Wind: <span id="wind"></span> km/h</span>
            </div>

            <!-- Forecast Container -->
            <div class="forecast-container" id="forecastList">
                
            </div>
        </div>

       
        <p id="welcomeText" class="welcome-text">Search a city or use location to get started</p>
    
    </div>

    <script src="app.js"></script>
</body>
</html>
